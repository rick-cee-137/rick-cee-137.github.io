# Site Identity
title: "Corners were cut here!"
description: ""
author: "Tariq"

# URLs
baseurl: "" 
url: "https://rick-cee-137.github.io"

# Theme (Updated to current version)
remote_theme: just-the-docs/just-the-docs

# Essential Plugins
plugins:
  - jekyll-seo-tag      # SEO meta tags
  - jekyll-sitemap      # Auto-generate sitemap
  - jekyll-feed         # RSS feed (optional but recommended)
  # - jekyll-github-metadata    # Only if you need GitHub data
  - jekyll-include-cache      # Only if you have slow builds

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 2
  preview_words_before: 3
  preview_words_after: 3
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Navigation
nav_external_links:
  - title: GitHub Profile
    url: https://github.com/rick-cee-137
    hide_icon: false

# UI Configuration
color_scheme: light
callouts_level: quiet # or loud
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

# Footer
footer_content: 'Copyright &copy; 2025 Tariq. Distributed under the <a href="https://github.com/rick-cee-137/rick-cee-137.github.io/blob/main/LICENSE">MIT license</a>.'

# Content Processing
include: ["_pages", "_posts"]
permalink: pretty

# Blog/Post Settings
show_excerpts: true
paginate: 10

# SEO Enhancement (works with jekyll-seo-tag)
social:
  name: Tariq
  links:
    - https://github.com/rick-cee-137

# Default front matter for better SEO
defaults:
  # - scope:
  #     path: ""
  #     type: "posts"
  #   values:
  #     layout: "post"
  #     author: "Tariq"
  - scope:
      path: "pages"
      type: "pages"
    values:
      layout: "default"

# Performance (if you decide to use jekyll-include-cache)
# liquid:
#   error_mode: warn
#   strict_filters: false
#   strict_variables: false